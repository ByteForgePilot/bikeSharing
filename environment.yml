name: bikeSharing
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Backend
  - fastapi>=0.115
  - uvicorn>=0.34
  - sqlalchemy>=2.0
  - alembic>=1.14
  - asyncpg>=0.30
  - pydantic>=2.10
  - pydantic-settings>=2.7
  - python-jose>=3.3
  - cryptography
  - passlib>=1.7
  - bcrypt<4
  - python-multipart>=0.0.18
  - redis-py>=5.2
  - httptools

  # Signal processing & ML
  - numpy>=2.2
  - scipy>=1.14
  - scikit-learn>=1.6
  - matplotlib>=3.10
  - seaborn>=0.13
  - pandas>=2.2
  - joblib>=1.4

  # Notebook
  - jupyter>=1.1

  # Testing
  - pytest>=8.3
  - pytest-asyncio>=0.24
  - httpx>=0.28

  - pip
  - pip:
      - librosa>=0.10
